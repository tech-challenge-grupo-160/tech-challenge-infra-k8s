# Ajustes do Deployment da API para rodar no EKS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-mecanica-api
spec:
  template:
    metadata:
      labels:
        # Unified service tagging: logs, traces e metricas do pod com o mesmo
        # service/env no Datadog, para o log abrir o trace e vice-versa (F4-32).
        tags.datadoghq.com/service: oficina-mecanica-api
        tags.datadoghq.com/env: __AMBIENTE__
      annotations:
        # source csharp aplica o pipeline de logs .NET do Datadog; o JSON do
        # servico ja traz dd.trace_id/dd.span_id para a correlacao com o trace.
        ad.datadoghq.com/api.logs: '[{"source":"csharp","service":"oficina-mecanica-api"}]'
    spec:
      containers:
        - name: api
          # IfNotPresent, nao Never. `Never` era correto no kind, onde a imagem
          # era carregada no node por fora com `kind load`. No EKS os nodes sao
          # efemeros e nao tem imagem alguma pre-carregada: com Never o pod fica
          # em ErrImageNeverPull para sempre.
          imagePullPolicy: IfNotPresent
          env:
            # A connection string do RDS e a chave do JWT vem do Secret
            # `api-secret`, que o deploy cria a partir do Secrets Manager. Ver
            # RFC-0002: a API le o segredo no startup, entao trocar o segredo
            # exige rollout restart dos pods.
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ConnectionStrings__DefaultConnection
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: Jwt__SecretKey
            # Unified service tagging para o tracer e o DogStatsD. __AMBIENTE__
            # e substituido no deploy (dev/hom/prod) pelo mesmo sed que resolve
            # newTag/newName acima. DD_AGENT_HOST aponta pro IP do node: o
            # Agent roda como DaemonSet, nunca fixe um IP de node aqui.
            - name: DD_SERVICE
              value: oficina-mecanica-api
            - name: DD_ENV
              value: __AMBIENTE__
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          # O /health do ASP.NET consulta o banco. Na nuvem o RDS pode levar
          # alguns segundos a mais para aceitar a primeira conexao, e a migration
          # roda no startup - por isso a folga maior que a do kind.
          readinessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3
